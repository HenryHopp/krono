 font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

 padding:34px 26px;max-width:380px;width:100%;text-align:center}
.big{font-size:56px;font-weight:700;color:var(--accent);letter-spacing:-.02em;line-height:1}

p{color:var(--ink-2);font-size:14.5px;line-height:1.55;margin:0 0 22px}

 padding:13px;border-radius:11px;font-weight:650;font-size:15px}
